plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id 'com.google.devtools.ksp'
}

android {
    compileSdk 36
    namespace 'dev.meres.hackeat.data'

    buildFeatures {
        viewBinding = true
    }
    
    defaultConfig {
        applicationId "com.example.kyl"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "2.2.10"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/src/schemas".toString()
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs = ['-Xjvm-default=all-compatibility']
    }
    namespace 'com.example.KYL'
}

// KSP does not support argument per flavor so we set it to global instead.
ksp {
    arg("room.schemaLocation","$projectDir/src/schemas".toString())
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'



    // RV
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Room
    implementation 'androidx.room:room-ktx:2.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    ksp 'androidx.room:room-compiler:2.8.0'
    implementation 'androidx.room:room-ktx:2.8.0'
    implementation 'androidx.room:room-paging:2.8.0'

    // LiveData
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.3'

    //Preference
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Excel
    implementation 'org.apache.poi:poi:5.4.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    //GSON
    implementation 'com.google.code.gson:gson:2.13.2'

    //Navigation
    implementation("androidx.navigation:navigation-fragment-ktx:2.9.4")
    implementation("androidx.navigation:navigation-ui-ktx:2.9.4")
    implementation("androidx.navigation:navigation-dynamic-features-fragment:2.9.4")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation("androidx.navigation:navigation-testing:2.9.4")
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
}

